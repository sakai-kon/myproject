<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試す | 飛騨防災ガイド</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Noto Sans JP', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="font-bold text-lg text-orange-600 flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-orange-600"></span>
        飛騨防災ガイド
      </a>
      <nav class="flex gap-4 text-sm font-bold text-slate-600">
        <a href="hazard.html" class="hover:text-orange-600 transition">ハザードマップ</a>
        <a href="bag.html" class="hover:text-orange-600 transition">避難バッグ</a>
        <a href="quiz.html" class="text-orange-600">クイズ</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 space-y-8">
    <div class="flex items-center justify-between">
      <div>
        <span class="text-xs font-bold text-orange-600">SECTION 03</span>
        <h1 class="text-2xl font-bold text-slate-900">防災アクション・クイズ</h1>
      </div>
      <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-orange-600 transition">← トップへ戻る</a>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-sm space-y-6">
      <div class="bg-orange-50 border border-orange-100 p-4 rounded-xl">
        <span class="text-xs font-bold text-orange-600 uppercase">Question 01</span>
        <h2 class="font-bold text-lg text-slate-900 mt-1">登校中に激しい揺れ！横には「古いブロック塀」があります。最初にとるべき行動は？</h2>
      </div>

      <div class="grid md:grid-cols-2 gap-4">
        <button onclick="alert('⭕️ 正解！\nブロック塀は地震で一番倒れやすく非常に危険です。カバンなどで頭を保護しながら速やかに離れましょう！')" class="p-5 text-left border-2 border-slate-200 rounded-xl hover:border-orange-500 hover:bg-orange-50 font-bold text-slate-800 transition">
          A: カバンで頭を守り、ブロック塀からすぐに離れる
        </button>
        <button onclick="alert('❌ ざんねん…\n古いブロック塀は一瞬で崩れ落ちる可能性があります。絶対に近づいたり支えようとしてはいけません。')" class="p-5 text-left border-2 border-slate-200 rounded-xl hover:border-orange-500 hover:bg-orange-50 font-bold text-slate-800 transition">
          B: 倒れてこないようにブロック塀を手で押さえる
        </button>
      </div>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
    © 2026 飛騨中生防災プロジェクト
  </footer>

</html>
