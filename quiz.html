<script src="assets/js/main.js"></script>
<script>
/* ページ固有のクイズロジック（IIFEでスコープを分離） */
(() => {
  'use strict';

  const QUESTIONS = [
    {
      q: '登校中に激しい揺れ！横には「古いブロック塀」があります。最初にとるべき行動は？',
      options: [
        { text: 'カバンで頭を守り、ブロック塀からすぐに離れる', correct: true, note: 'ブロック塀は地震で最も倒れやすく非常に危険です。カバンなどで頭を保護しながら速やかに離れましょう。' },
        { text: '倒れてこないようにブロック塀を手で押さえる', correct: false, note: '古いブロック塀は一瞬で崩れ落ちる可能性があります。絶対に近づいたり支えようとしてはいけません。' },
      ],
    },
    {
      q: '大雨警報が出ている中、川の近くの通学路を歩いていました。とるべき行動は？',
      options: [
        { text: '増水の様子を近くで確認してから避難する', correct: false, note: '川は急に増水することがあり、確認している間に危険な状態になる恐れがあります。' },
        { text: '川からすぐに離れ、高い場所や安全な避難場所へ向かう', correct: true, note: '正解です。増水の兆候があるときは、迷わずすぐに川から離れることが最優先です。' },
      ],
    },
    {
      q: '避難所に着きました。まず最初にすべきことは？',
      options: [
        { text: '受付で氏名を伝え、家族へ安否確認の連絡をする', correct: true, note: '受付で氏名を伝えることで安否確認がスムーズになり、家族への連絡で互いの安心にもつながります。' },
        { text: 'すぐに友達を探して自由に行動する', correct: false, note: 'まずは受付と安否確認が優先です。落ち着いて避難所のルールに従いましょう。' },
      ],
    },
  ];

  const listEl = document.getElementById('quiz-list');
  const scoreEl = document.getElementById('quiz-score');
  const resultEl = document.getElementById('quiz-result');
  const resultTextEl = document.getElementById('quiz-result-text');
  const retryBtn = document.getElementById('quiz-retry');

  let score = 0;
  let answered = 0;

  const render = () => {
    listEl.innerHTML = '';
    score = 0;
    answered = 0;
    scoreEl.textContent = `0 / ${QUESTIONS.length} 正解`;
    resultEl.classList.add('hidden');

    QUESTIONS.forEach((item, qIndex) => {
      const card = document.createElement('div');
      card.className = 'glass-card p-6 md:p-7 reveal is-visible';

      const badge = document.createElement('span');
      badge.className = 'eyebrow';
      badge.textContent = `QUESTION 0${qIndex + 1}`;

      const question = document.createElement('h2');
      question.className = 'font-bold text-lg mt-2 mb-5';
      question.style.color = 'var(--ink)';
      question.textContent = item.q;

      const grid = document.createElement('div');
      grid.className = 'grid gap-3';

      const feedback = document.createElement('div');
      feedback.className = 'quiz-feedback mt-4';
      feedback.innerHTML = `<div class="text-sm leading-relaxed p-4 rounded-xl" style="background:var(--bg-alt);color:var(--ink-muted)"></div>`;

      item.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'quiz-option text-left p-4 rounded-xl font-bold text-sm border-2';
        btn.style.borderColor = 'var(--border)';
        btn.style.color = 'var(--ink)';
        btn.textContent = opt.text;

        btn.addEventListener('click', () => {
          const buttons = grid.querySelectorAll('button');
          buttons.forEach((b) => (b.disabled = true));
          btn.classList.add(opt.correct ? 'is-correct' : 'is-wrong');

          if (!opt.correct) {
            const correctBtn = Array.from(buttons).find((_, i) => item.options[i].correct);
            correctBtn?.classList.add('is-correct');
          } else {
            score += 1;
          }

          answered += 1;
          scoreEl.textContent = `${score} / ${QUESTIONS.length} 正解`;

          const inner = feedback.querySelector('div');
          inner.textContent = (opt.correct ? '⭕ 正解！ ' : '❌ ざんねん… ') + opt.note;
          feedback.classList.add('is-open');

          if (answered === QUESTIONS.length) {
            setTimeout(() => {
              resultTextEl.textContent = `${QUESTIONS.length}問中 ${score}問正解でした。防災知識ページで詳しい行動のポイントも確認しよう。`;
              resultEl.classList.remove('hidden');
            }, 300);
          }
        });

        grid.appendChild(btn);
      });

      card.appendChild(badge);
      card.appendChild(question);
      card.appendChild(grid);
      card.appendChild(feedback);
      listEl.appendChild(card);
    });
  };

  retryBtn.addEventListener('click', render);
  document.addEventListener('DOMContentLoaded', render);
})();
</script>
