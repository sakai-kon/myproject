<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>備える | 飛騨防災ガイド</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }
    .checklist-item input:checked + span { text-decoration: line-through; color: #94A3B8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="font-bold text-lg text-orange-600 flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-orange-600"></span>
        飛騨防災ガイド
      </a>
      <nav class="flex gap-4 text-sm font-bold text-slate-600">
        <a href="hazard.html" class="hover:text-orange-600 transition">ハザードマップ</a>
        <a href="bag.html" class="text-orange-600">避難バッグ</a>
        <a href="quiz.html" class="hover:text-orange-600 transition">クイズ</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 space-y-8">
    <div class="flex items-center justify-between">
      <div>
        <span class="text-xs font-bold text-orange-600">SECTION 02</span>
        <h1 class="text-2xl font-bold text-slate-900">中学生の非常用持ち出しバッグ</h1>
      </div>
      <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-orange-600 transition">← トップへ戻る</a>
    </div>

    <div class="grid md:grid-cols-2 gap-8 items-start">
      <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
        <h2 class="font-bold text-lg text-slate-900 border-b pb-2">準備チェックリスト（タップして消し込み）</h2>
        <div class="space-y-3">
          <label class="checklist-item flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer hover:bg-orange-50 transition border border-slate-100">
            <input type="checkbox" class="w-5 h-5 accent-orange-600 rounded">
            <span class="text-sm font-medium text-slate-700">生徒手帳・生徒証（避難所での身分証明）</span>
          </label>
          <label class="checklist-item flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer hover:bg-orange-50 transition border border-slate-100">
            <input type="checkbox" class="w-5 h-5 accent-orange-600 rounded">
            <span class="text-sm font-medium text-slate-700">モバイルバッテリー ＆ 充電コード</span>
          </label>
          <label class="checklist-item flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer hover:bg-orange-50 transition border border-slate-100">
            <input type="checkbox" class="w-5 h-5 accent-orange-600 rounded">
            <span class="text-sm font-medium text-slate-700">飲料水（500ml 1〜2本）</span>
          </label>
          <label class="checklist-item flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer hover:bg-orange-50 transition border border-slate-100">
            <input type="checkbox" class="w-5 h-5 accent-orange-600 rounded">
            <span class="text-sm font-medium text-slate-700">高カロリーなお菓子（ゼリーやカロリーメイト）</span>
          </label>
          <label class="checklist-item flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer hover:bg-orange-50 transition border border-slate-100">
            <input type="checkbox" class="w-5 h-5 accent-orange-600 rounded">
            <span class="text-sm font-medium text-slate-700">予備のメガネ・コンタクト用品・常備薬</span>
          </label>
        </div>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4 text-center">
        <h2 class="font-bold text-lg text-slate-900 border-b pb-2">バッグのイメージ（AIイラスト）</h2>
        <div class="w-full aspect-square bg-orange-50 rounded-xl overflow-hidden border border-slate-200 flex items-center justify-center">
          <img src="https://placehold.co/500x500/FF6B35/FFFFFF?text=AI+Bag+Image" alt="AI生成イラスト" class="w-full h-full object-cover">
        </div>
        <p class="text-xs text-slate-400">※ここに生成したAI画像を配置します。</p>
      </div>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
    © 2026 飛騨中生防災プロジェクト
  </footer>

</body>
</html>
