<main id="main" class="flex-1">
  <section class="ambient-bg max-w-6xl mx-auto px-5 md:px-8 pt-14 pb-10">
    <div class="reveal flex flex-wrap items-end justify-between gap-4 mb-10">
      <div>
        <span class="eyebrow">Section 02</span>
        <h1 class="font-display font-extrabold mt-2" style="font-size:clamp(1.8rem,3.4vw,2.6rem);color:var(--ink)">中学生の非常用持ち出しバッグ</h1>
        <p class="mt-2 max-w-xl" style="color:var(--ink-muted)">タップしてチェック。準備状況はブラウザに自動で保存されます。</p>
      </div>
      <a href="index.html" class="btn btn-secondary">← トップへ戻る</a>
    </div>

    <div class="grid lg:grid-cols-[1.2fr_0.8fr] gap-8 items-start">
      <div class="glass-card is-hoverable p-6 md:p-8 reveal">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-display font-bold text-lg" style="color:var(--ink)">準備チェックリスト</h2>
          <span data-check-progress-label class="text-xs font-bold" style="color:var(--orange-dark)">0 / 8 完了</span>
        </div>
        <div class="w-full h-2 rounded-full mb-6 overflow-hidden" style="background:var(--bg-alt)">
          <div data-check-progress-bar class="h-full rounded-full" style="width:0%;background:linear-gradient(90deg,var(--orange),var(--blue));transition:width .4s var(--ease)"></div>
        </div>

        <div class="space-y-3">
          <label class="check-row">
            <input type="checkbox" data-check-id="id-card">
            <span>生徒手帳・生徒証（避難所での身分証明）</span>
          </label>
          <label class="check-row">
            <input type="checkbox" data-check-id="battery">
            <span>モバイルバッテリー ＆ 充電コード</span>
          </label>
          <label class="check-row">
            <input type="checkbox" data-check-id="water">
            <span>飲料水（500ml 1〜2本）</span>
          </label>
          <label class="check-row">
            <input type="checkbox" data-check-id="snacks">
            <span>高カロリーなお菓子（ゼリーやカロリーメイト）</span>
          </label>
          <label class="check-row">
            <input type="checkbox" data-check-id="medical">
            <span>予備のメガネ・コンタクト用品・常備薬</span>
          </label>
          <label class="check-row">
            <input type="checkbox" data-check-id="light">
            <span>携帯用ライト・ホイッスル</span>
          </label>
          <label class="check-row">
            <input type="checkbox" data-check-id="rain">
            <span>レインコート・軍手</span>
          </label>
          <label class="check-row">
            <input type="checkbox" data-check-id="cash">
            <span>小銭・小額の現金</span>
          </label>
        </div>
      </div>

      <div class="glass-card p-6 md:p-8 text-center reveal" style="transition-delay:.08s">
        <h2 class="font-display font-bold text-lg mb-4" style="color:var(--ink)">持ち出しバッグのイメージ</h2>
        <svg viewBox="0 0 240 240" class="w-full max-w-[240px] mx-auto" role="img" aria-label="非常用持ち出しバッグのイラスト">
          <rect x="30" y="70" width="180" height="150" rx="26" fill="var(--orange-soft)"/>
          <rect x="55" y="40" width="60" height="46" rx="16" fill="none" stroke="var(--orange)" stroke-width="7"/>
          <rect x="46" y="90" width="148" height="118" rx="18" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
          <rect x="70" y="90" width="100" height="34" rx="10" fill="var(--orange)"/>
          <path d="M120 100v14M113 107h14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
          <circle cx="70" cy="180" r="8" fill="var(--blue)"/>
          <circle cx="170" cy="180" r="8" fill="var(--blue)"/>
          <rect x="90" y="150" width="60" height="10" rx="5" fill="var(--border)"/>
        </svg>
        <p class="text-xs mt-4" style="color:var(--ink-faint)">※イメージ図。実際の中身は成長や季節に合わせて見直そう。</p>
      </div>
    </div>
  </section>
</main>
