<header class="site-header">
  <div class="max-w-6xl mx-auto px-5 md:px-8 h-20 flex items-center justify-between">
    <a href="index.html" class="font-display font-extrabold text-lg flex items-center gap-2.5" style="color:var(--ink)">
      <span class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,var(--orange),var(--orange-dark))">
        <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5"><path d="M3 18L9 7L13 13L17 5L21 18" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      飛騨防災ガイド
    </a>
    <nav class="hidden md:flex items-center gap-8" aria-label="メインナビゲーション">
      <a href="index.html" class="nav-link">ホーム</a>
      <a href="hazard.html" class="nav-link">避難場所・ハザードマップ</a>
      <a href="bag.html" class="nav-link">持ち物</a>
      <a href="knowledge.html" class="nav-link">防災知識</a>
      <a href="quiz.html" class="nav-link">クイズ</a>
      <a href="contact.html" class="nav-link is-active">お問い合わせ</a>
    </nav>
    <div class="flex items-center gap-3">
      <button data-theme-toggle type="button" class="theme-toggle" aria-label="ダークモード切り替え" aria-pressed="false">
        <span class="knob"><svg viewBox="0 0 24 24" fill="none" class="w-3 h-3"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
      </button>
      <button data-menu-toggle type="button" class="md:hidden" aria-label="メニューを開く" aria-expanded="false" aria-controls="mobile-menu">
        <span class="burger"><span></span><span></span><span></span></span>
      </button>
    </div>
  </div>
  <div id="mobile-menu" data-mobile-menu class="mobile-menu md:hidden border-t" style="border-color:var(--border);background:var(--surface-glass-strong);backdrop-filter:blur(16px)">
    <nav class="px-5 py-4 flex flex-col gap-1" aria-label="モバイルナビゲーション">
      <a href="index.html" class="nav-link py-2.5">ホーム</a>
      <a href="hazard.html" class="nav-link py-2.5">避難場所・ハザードマップ</a>
      <a href="bag.html" class="nav-link py-2.5">持ち物</a>
      <a href="knowledge.html" class="nav-link py-2.5">防災知識</a>
      <a href="quiz.html" class="nav-link py-2.5">クイズ</a>
      <a href="contact.html" class="nav-link py-2.5">お問い合わせ</a>
    </nav>
  </div>
</header>

<main id="main" class="flex-1">
  <section class="ambient-bg max-w-2xl mx-auto px-5 md:px-8 py-16">
    <div class="reveal text-center mb-10">
      <span class="eyebrow justify-center">お問い合わせ</span>
      <h1 class="font-display font-extrabold mt-2" style="font-size:clamp(1.8rem,3.4vw,2.4rem);color:var(--ink)">ご意見・ご感想</h1>
      <p class="mt-2" style="color:var(--ink-muted)">このサイトについてのご意見・誤りのご指摘などをお寄せください。</p>
    </div>

    <form class="glass-card p-7 md:p-9 space-y-5 reveal" onsubmit="event.preventDefault(); this.querySelector('[data-submit-note]').classList.remove('hidden');">
      <div>
        <label for="name" class="block text-sm font-bold mb-2" style="color:var(--ink)">お名前</label>
        <input id="name" name="name" type="text" required class="w-full px-4 py-3 rounded-xl text-sm" style="background:var(--bg-alt);border:1px solid var(--border);color:var(--ink)">
      </div>
      <div>
        <label for="email" class="block text-sm font-bold mb-2" style="color:var(--ink)">メールアドレス</label>
        <input id="email" name="email" type="email" required class="w-full px-4 py-3 rounded-xl text-sm" style="background:var(--bg-alt);border:1px solid var(--border);color:var(--ink)">
      </div>
      <div>
        <label for="message" class="block text-sm font-bold mb-2" style="color:var(--ink)">内容</label>
        <textarea id="message" name="message" rows="5" required class="w-full px-4 py-3 rounded-xl text-sm resize-none" style="background:var(--bg-alt);border:1px solid var(--border);color:var(--ink)"></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-full">送信する</button>
      <p data-submit-note class="hidden text-xs text-center pt-1" style="color:var(--ink-faint)">※本サイトは学習用デモのため、実際の送信機能はありません。</p>
    </form>
  </section>
</main>

<footer class="site-footer">
  <div class="max-w-6xl mx-auto px-5 md:px-8 py-10 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs" style="color:var(--ink-faint)">

    <div class="flex gap-5">
      <a href="privacy.html" class="footer-link">プライバシーポリシー</a>
      <a href="terms.html" class="footer-link">利用規約</a>
    </div>
  </div>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
